<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Page</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
      padding: 1.5rem;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
    }
    p {
      line-height: 1.6;
      color: #cbd5e1;
    }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-size: 0.85rem;
      font-weight: 600;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #2563eb;
    }
    #counter {
      font-weight: 700;
      color: #93c5fd;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>👋 Hello from GitHub Pages</h1>
    <p>This is a minimal static demo page. It has no backend, no secrets, and no server-side code — just HTML, CSS, and a little JavaScript.</p>
    <span class="badge">Static • Client-side only</span>
    <p>Button clicks: <span id="counter">0</span></p>
    <button id="clickBtn">Click me</button>
    <footer>Deployed via GitHub Pages — restrict access with Cloudflare Access or similar if needed.</footer>
  </main>

  <script>
    let count = 0;
    const counterEl = document.getElementById('counter');
    document.getElementById('clickBtn').addEventListener('click', () => {
      count += 1;
      counterEl.textContent = count;
    });
  </script>
</body>
</html>
